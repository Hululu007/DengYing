name: Android APK (release)

on:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "DengYing/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x DengYing/gradlew

      - name: Build release APK
        working-directory: DengYing
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK is signed
        run: |
          APK=DengYing/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DengYing-release-apk
          path: DengYing/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" DengYing/app/build/outputs/apk/release/app-release.apk --clobber
