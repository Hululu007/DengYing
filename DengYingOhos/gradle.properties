# ---- JVM ----
# CPF 线的 K/N 链接（ohosArm64/ohosX64 sharedLib）比 JVM 编译吃内存得多，
# 4G 是实测下限（2G 会在 linkDebugSharedOhosX64 阶段 OOM）。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3072m
# 关掉并行：一次只链一个 K/N target，避免两个 link 任务同时抢 4G 堆。
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# ---- AndroidX ----
android.useAndroidX=true

# ---- Kotlin ----
kotlin.code.style=official
kotlin.incremental=true

# ---- AGP ----
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# 自建中间源集（jvmSharedMain / ohosMain），故关闭 KMP 默认层级模板，
# 否则 Gradle 报「dependsOn 边与模板冲突」。详见 shared/build.gradle.kts。
kotlin.mpp.applyDefaultHierarchyTemplate=false

# ---- CMP 鸿蒙渲染后端 ----
# 由 org.jetbrains.compose 的 Gradle 插件读取（ComposePlugin$apply$1
# .resolveOhosBackendConfig）。可选值：skia | fusion-renderer。
#
# 取 fusion-renderer，两条理由（都是实测，不是取舍偏好）：
#
# 1. 与 compose.har 的契约一致。har 的 modules.abc 硬编码向宿主 libentry.so
#    取 nativeCreateRootNode / nativeOHRenderNodeDraw / nativeOHRenderNotifyRedraw /
#    nativeRegisterNodeConstructor / nativeRegisterNodeStatusModifyConstructor /
#    nativeSetPixelRatio 这 6 个旧名 fusion 入口，且 getRenderBackendId 期望 1。
#    skia 后端下 getRendererTypeId 返回 0，har 走 XComponent+EGL 那条路，
#    实测 eglSwapBuffers 连续两次 error 1，画面停在窗口背景色。
#
# 2. FusionShim.ohos.kt 依赖它。org.jetbrains.skia.OHRenderNode 只存在于
#    skiko 的 fusion 变体（skiko-ohosx64-fusionrenderer）；skia 后端不会把这个
#    变体放进编译 classpath，设 skia 时 :ui:compileKotlinOhosX64 直接报
#    Unresolved reference 'OHRenderNode'（7 处）。
#
# 当前进度：fusion 注入链路已全通（initRenderNodeContext / initFusionRendererNode /
# jsNode 挂上 FrameNode / notifyRedraw 60fps），卡在 har 的 CanvasNode.draw 不被驱动。
# 切换史与取证见 docs/04-验证记录.md 的 P6 段。
rendererBackend=skia
