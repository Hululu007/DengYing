# ---- JVM ----
# 固定 4G：AGP + Kotlin 守护进程同机运行，默认 2G 在增量编译大模块时会 OOM。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# ---- AndroidX ----
# 必需：本项目用 AndroidX，不使用已停止维护的支持库。
android.useAndroidX=true

# ---- Kotlin ----
kotlin.code.style=official
# 官方推荐的新版后端；确定性更好，编译更快。
kotlin.incremental=true

# ---- AGP ----
# 非传递 R 类：每个模块只生成自己的 R，编译更快、避免符号串味。
android.nonTransitiveRClass=true
# 显式关闭 BuildConfig 之外的自动特性，避免 AGP 版本升级带来的行为漂移。
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# :shared 用自建中间源集 jvmSharedMain（androidMain 与 jvmMain 共用 actual），
# 因此关闭 KMP 的默认层级模板——否则 Gradle 会警告「dependsOn 边与模板冲突」。
# 详见 shared/build.gradle.kts 里 sourceSets 段的注释。
kotlin.mpp.applyDefaultHierarchyTemplate=false
